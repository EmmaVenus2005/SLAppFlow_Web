name: Manual Deployment to Production (Apps excluded)

on:
  workflow_dispatch:  # Manual trigger via GitHub interface

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: .

      - name: Clean /var/www/html except /apps
        run: |
          find /var/www/html -mindepth 1 -maxdepth 1 \
            ! -name 'apps' \
            -exec rm -rf {} +

      - name: Deploy Files to /var/www/html (excluding .git, .gitignore, and /apps)
        run: |
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='apps' \
            "$GITHUB_WORKSPACE"/ /var/www/html/