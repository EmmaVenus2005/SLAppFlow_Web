name: Manual Deployment of Single App

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Name of the app folder in /apps to deploy'
        required: true
        type: string

jobs:
  deploy_app:
    name: Deploy Selected App to Production
    runs-on: [self-hosted, vm010]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check if app exists in repo
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/apps/${{ github.event.inputs.app_name }}" ]; then
            echo "❌ Error: App folder '${{ github.event.inputs.app_name }}' not found in repo."
            exit 1
          fi

      - name: Ensure destination folder exists
        run: |
          mkdir -p "/var/www/html/apps/${{ github.event.inputs.app_name }}"

      - name: Clean destination folder before deployment
        run: |
          find "/var/www/html/apps/${{ github.event.inputs.app_name }}" -mindepth 1 -exec rm -rf {} +

      - name: Deploy selected app to /var/www/html/apps
        run: |
          rsync -a \
            "$GITHUB_WORKSPACE/apps/${{ github.event.inputs.app_name }}/" \
            "/var/www/html/apps/${{ github.event.inputs.app_name }}/"

      - name: List deployed app content
        run: ls -la "/var/www/html/apps/${{ github.event.inputs.app_name }}"
