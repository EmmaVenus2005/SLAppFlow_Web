<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Events List</title>
    </head>
    <body>
        <div class="container">
            
            <!-- Left panel: Filters and paintings list -->
            <div class="left-panel">

                <!-- Dropdown for variants/lists (future extension) -->
                <div class="board-set" style="margin-bottom:8px;">
                    <select>
                        <!-- Injected by JS -->
                        <option>EmmaVenus2005 - The Dawn Star</option>
                    </select>

                    <div class="add-project" id="add-project">
                        <button id="add-project-btn">➕</button>
                    </div>
                </div>
                
                <!-- Dropdown for variants/lists (future extension) -->
                <div class="main-view" style="margin-bottom:8px;">
                    <select>
                        <option>Events List</option>
                        <option>Artists List</option>
                        <option>Venues List</option>
                        <option>Boards List</option>
                    </select>
                </div>
                
                <!-- Filters + Columns button in one row -->
                <div class="filters">
                    <div>
                        <label><input type="checkbox" class="filter-checkbox" value="inactive" checked> Inactive</label>
                        <label><input type="checkbox" class="filter-checkbox" value="upcoming" checked> Upcoming</label>
                        <label><input type="checkbox" class="filter-checkbox" value="active" checked> Active</label>
                        <label><input type="checkbox" class="filter-checkbox" value="ended" checked> Ended</label>
                        <label><input type="checkbox" class="filter-checkbox" value="hold" checked> Cancelled</label>
                    </div>
                    <div class="settings-buttons">
                        <div class="add-entity" id="add-entity">
                            <button id="add-entity-btn">➕</button>
                            <div id="add-entity-menu"><!-- Injected by JS --></div>
                        </div>                        
                        <div class="settings" id="settings">
                            <button id="settings-btn">⚙️</button>
                            <div id="settings-menu"><!-- Injected by JS --></div>
                        </div>
                        <div class="column-options" id="column-options">
                            <button id="column-options-btn">☰</button>
                            <div id="column-options-menu"><!-- Injected by JS --></div>
                        </div>
                    </div>
                </div>
                
                <!-- Events table: main listing -->
                <table class="events-table">
                    <thead>
                        <!-- Content is injected via JS -->
                    </thead>
                    <tbody id="events-tbody">
                        <!-- Content is injected via JS -->
                    </tbody>
                </table>

                <!-- Artists table: main listing -->
                <table class="artists-table">
                    <thead>
                        <!-- Content is injected via JS -->
                    </thead>
                    <tbody id="artists-tbody">
                        <!-- Content is injected via JS -->
                    </tbody>
                </table>

                <!-- Venues table: main listing -->
                <table class="venues-table">
                    <thead>
                        <!-- Content is injected via JS -->
                    </thead>
                    <tbody id="venues-tbody">
                        <!-- Content is injected via JS -->
                    </tbody>
                </table>

                <!-- Boards table: main listing -->
                <table class="boards-table">
                    <thead>
                        <!-- Content is injected via JS -->
                    </thead>
                    <tbody id="boards-tbody">
                        <!-- Content is injected via JS -->
                    </tbody>
                </table>

            </div>

            <!-- Right panel: Preview and details (tabs) -->
            <div class="right-panel">

                <!-- Artwork preview -->
                <div class="preview" id="preview-image">
                    <!-- <span class="preview-upload-icon" title="Upload image">⬆️</span> -->
                    <span style="color:#bbb;">No preview</span>
                </div>
                
                <!-- Tabs for details -->
                <div class="tabs">
                    <div class="tab active" data-tab="general">General</div>
                    <div class="tab" data-tab="auction">Auction</div>
                    <div class="tab" data-tab="tracking">Tracking</div>
                </div>
                
                <!-- Tab content area -->
                <div class="tab-content" id="tab-content">
                    <!-- Content is injected via JS -->
                </div>
            
            </div>
        </div>

        <!-- Add Entity Overlay (injected by JS) -->
        <div id="add-entity-overlay" class="overlay" style="display:none;">
            <div class="overlay-backdrop" data-overlay-close="1"></div>
            <div class="overlay-panel" role="dialog" aria-modal="true" aria-labelledby="add-entity-title">
                <div class="overlay-header">
                    <div id="add-entity-title" class="overlay-title">Add</div>
                    <button id="add-entity-close-btn" class="overlay-close-btn" title="Close">✕</button>
                </div>
                <div id="add-entity-content" class="overlay-content">
                    <!-- Injected by JS -->
                </div>
            </div>
        </div>

        <!-- Include SLAppFlow public functions -->
        <script src="/webcontrol/include_functions.js"></script>

        <script>

            // Constants and variables
            // ...


            // Main async flow
            // ---------------

            WebControlReady.then(async function() 
            {

                // Load the CSS styles using WCGetInclude()
                document.head.insertAdjacentHTML("beforeend",`<style>${await WCGetInclude("style.css")}</style>`)

                // Loads the JavaScript functions using WCGetInclude()
                const jsCode = await WCGetInclude( "functions.js");
                const script = document.createElement("script");
                script.textContent = jsCode;
                document.head.appendChild(script);

                // More code to initialize the app
                // ... 

                // Adding event listeners
                // ----------------------
                
                // Close interactions
                document.addEventListener("click", (e) => {
                    if (e.target && e.target.getAttribute("data-overlay-close") === "1") {
                        closeAddEntityOverlay();
                    }
                });

                document.getElementById("add-entity-close-btn")?.addEventListener("click", closeAddEntityOverlay);
                document.addEventListener("keydown", (e) => {
                    if (e.key === "Escape") closeAddEntityOverlay();
                });

                document.getElementById("add-entity-btn")?.addEventListener("click", () => {
                    const view = document.getElementById("main-view-select")?.value || "Events List";

                    if (view === "Events List") {
                        openAddEntityOverlay("Add Event", `<div>…event form…</div>`);
                    } else if (view === "Artists List") {
                        openAddEntityOverlay("Add Artist", `<div>…artist form…</div>`);
                    }
                });

                // Add project button listener
                addCreateProjectListener();

            }); // WC ready end

        </script>

    </body>
</html>
