<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MediaBoard</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: #0f0f10;
      color: #f0f0f0;
      overflow: hidden;
    }

    .board {
      width: 760px;
      max-width: calc(100vw - 40px);
      margin: 28px auto;
      background: #1b1b1f;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(0,0,0,0.45);
      padding: 18px;
      box-sizing: border-box;
      position: relative;
    }

    .frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0b0b0d;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .frame img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 320ms ease-in-out;
        background: #000;
    }

    .frame img.is-visible {
        opacity: 1;
    }

    .meta {
      margin-top: 12px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .meta .left {
      font-size: 13px;
      opacity: 0.85;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta .right {
      font-size: 12px;
      opacity: 0.65;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 200, 51, 0.14);
      color: #ffc833;
      font-weight: 600;
      letter-spacing: 0.2px;
      margin-right: 8px;
    }

    .hint {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 12px;
      opacity: 0.7;
      background: rgba(0,0,0,0.35);
      padding: 6px 10px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
    }
  </style>
</head>

<body>
  <div class="board" id="boardRoot" style="display:none;">
    <div class="hint" id="boardHint">Loading…</div>

    <div class="frame">
        <img id="slideImgA" alt="Slide A" />
        <img id="slideImgB" alt="Slide B" />
    </div>

    <div class="meta">
      <div class="left" id="slideLabel"></div>
      <div class="right" id="slideClock"></div>
    </div>
  </div>

  <!-- Include SLAppFlow public functions -->
  <script src="/webcontrol/include_functions.js"></script>

  <script>
    // -----------------------------------------------------------------------------
    // MediaBoard front-end (MEDIA)
    //
    // Key rule / time model (IMPORTANT):
    // - Humans create/edit Events in SLT (America/Los_Angeles) on the backend side.
    // - When the backend updates the board "slide" config, it converts all display windows
    //   to UNIX epoch seconds (UTC) and stores them in slide.items:
    //      { image_id, from_ts, until_ts, start_ts }
    //
    //   Meaning:
    //   - from_ts  : first second where the image is eligible to be shown (epoch UTC).
    //   - until_ts : first second where the image must STOP being shown (epoch UTC).
    //               (we treat it as an exclusive bound: now < until_ts)
    //   - start_ts : event start (epoch UTC). Often used by backend to compute until_ts:
    //               until_ts = start_ts + (show_mins_after_start * 60)
    //               Example: show_mins_after_start=0 => until_ts == start_ts
    //
    // Front-end responsibility:
    // - Do NOT recompute SLT conversions here.
    // - We only compare epoch seconds: nowTs() vs from_ts/until_ts.
    // - On each tick, we build the "active playlist" = items whose interval contains now.
    // - Slideshow runs only through that active playlist.
    //
    // Refresh model:
    // - We still refresh the slide data (LIST_BOARD_IMAGES) aligned to UTC top-of-hour,
    //   but the time-window filtering happens continuously on every tick.
    //   So images will disappear exactly at until_ts even if we do not refresh immediately.
    // -----------------------------------------------------------------------------

    // Read query params (board_id and owner_id are required for MEDIA)
    const params = new URLSearchParams(window.location.search);

    const state = {
      boardId: (params.get("board_id") || "").trim(),       // expected to be a UUID string
      ownerId: (params.get("owner_id") || "").trim(),       // expected to be a UUID string
      appId: null,                                          // set on load

      slideSec: 10,                                         // default (overridden by slide.step_sec)
      listRefreshMs: 60 * 60 * 1000,                        // 1 hour (used after UTC-aligned first tick)

      currentIdx: 0,                                        // current index in the ACTIVE playlist
      slideItems: [],                                       // raw items from backend (with epochs)

      cache: {},                                            // { [imageId]: { src: "data:image/...", ts: number, ready: Promise<string> } }
      tickTimer: null,                                      // setTimeout + setInterval combo (aligned to start_at)
      refreshTimer: null,                                   // interval handle
      refreshAlignTimer: null,                              // timeout handle (first aligned refresh)
      isStarted: false,
      activeLayer: "A",

      // Slide sync params (from backend slide node)
      slideStartAt: 0,                                      // UNIX seconds (UTC)
      lastSlideLoadedAt: 0,                                 // UNIX seconds (debug / info)
    };

    // UI refs
    const ui = {
        root: document.getElementById("boardRoot"),
        hint: document.getElementById("boardHint"),
        imgA: document.getElementById("slideImgA"),
        imgB: document.getElementById("slideImgB"),
        label: document.getElementById("slideLabel"),
        clock: document.getElementById("slideClock"),
    };

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return (params.get(name) || "").trim();
    }

    function nowTs() {
      // Epoch seconds are UTC by definition
      return Math.floor(Date.now() / 1000);
    }

    function setHint(text) {
      ui.hint.textContent = text;
    }

    function setClock() {
      // Keep local UI clock (does not affect sync logic)
      ui.clock.textContent = new Date().toLocaleString("en-GB", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function uniqueStrings(arr) {
      const out = [];
      for (const v of arr) {
        if (typeof v !== "string") continue;
        const s = v.trim();
        if (!s) continue;
        if (!out.includes(s)) out.push(s);
      }
      return out;
    }

    function purgeCache(keepIds) {
      const keep = new Set(keepIds);
      for (const k of Object.keys(state.cache)) {
        if (!keep.has(k)) delete state.cache[k];
      }
    }

    function makeMissingImageDataUrl(imageId, reason) {
      // SVG placeholder (acts like an image, so the slideshow continues smoothly)
      const safeId = String(imageId || "").replace(/[<>&"]/g, "");
      const safeReason = String(reason || "Missing image").replace(/[<>&"]/g, "");

      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#222"/>
              <stop offset="1" stop-color="#111"/>
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" fill="url(#g)"/>
          <text x="50%" y="44%" text-anchor="middle"
                font-family="system-ui, -apple-system, Segoe UI, Arial"
                font-size="40" fill="#ffc833" font-weight="700">
            Image not available
          </text>
          <text x="50%" y="54%" text-anchor="middle"
                font-family="system-ui, -apple-system, Segoe UI, Arial"
                font-size="22" fill="#eaeaea" opacity="0.9">
            ${safeReason}
          </text>
          <text x="50%" y="66%" text-anchor="middle"
                font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
                font-size="20" fill="#eaeaea" opacity="0.75">
            id: ${safeId}
          </text>
        </svg>`;

      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    // -----------------------------------------------------------------------------
    // Slide items parsing
    // - Backend slide.items already contains EPOCH seconds (UTC)
    // - We keep items as objects so we can filter by [from_ts, until_ts)
    // -----------------------------------------------------------------------------
    function extractSlideItems(slide) {
      const items = (slide && Array.isArray(slide.items)) ? slide.items : [];
      const out = [];

      for (const it of items) {
        if (!it || typeof it !== "object") continue;

        const imageId = String(it.image_id || "").trim();
        if (!imageId) continue;

        const fromTs  = Number(it.from_ts || 0);
        const untilTs = Number(it.until_ts || 0);
        const startTs = Number(it.start_ts || 0);

        out.push({
          image_id: imageId,
          from_ts:  Number.isFinite(fromTs)  ? fromTs  : 0,
          until_ts: Number.isFinite(untilTs) ? untilTs : 0,
          start_ts: Number.isFinite(startTs) ? startTs : 0,
        });
      }

      return out;
    }

    // -----------------------------------------------------------------------------
    // Active playlist (computed at runtime, no helpers explosion)
    // Rule:
    // - from_ts inclusive
    // - until_ts exclusive  (now < until_ts)
    // This ensures we stop showing exactly when the event starts if until_ts==start_ts.
    // -----------------------------------------------------------------------------
    function getActiveItems(now) {
      const items = Array.isArray(state.slideItems) ? state.slideItems : [];
      const active = [];

      for (const it of items) {
        const from = Number(it.from_ts || 0);
        const until = Number(it.until_ts || 0);

        const fromOk = (!from || now >= from);
        const untilOk = (!until || now < until);

        if (fromOk && untilOk) active.push(it);
      }

      return active;
    }

    // -----------------------------------------------------------------------------
    // Sync index against backend slideshow schedule (start_at + N*step_sec)
    // - We sync to step slots, then mod by "active playlist" length.
    // - That means everyone sees the same active image if they share the same slideStartAt/stepSec.
    // -----------------------------------------------------------------------------
    function computeSyncedIndex(total) {
      if (!total) return 0;

      const step = Math.max(1, state.slideSec);
      const startAt = (typeof state.slideStartAt === "number" && state.slideStartAt > 0)
        ? state.slideStartAt
        : nowTs();

      const elapsed = Math.max(0, nowTs() - startAt);
      const slot = Math.floor(elapsed / step);

      return slot % total;
    }

    function restartSlideLoopSynced() {
      if (state.tickTimer) {
        // tickTimer can be either timeout or interval depending on phase
        clearTimeout(state.tickTimer);
        clearInterval(state.tickTimer);
      }

      const stepSec = Math.max(1, state.slideSec);
      const stepMs = stepSec * 1000;

      // Align ticks to backend schedule (start_at + N*step_sec)
      const startAt = (typeof state.slideStartAt === "number" && state.slideStartAt > 0)
        ? state.slideStartAt
        : nowTs();

      const now = nowTs();
      const elapsed = Math.max(0, now - startAt);
      const intoStep = elapsed % stepSec;
      const msToNext = (stepSec - intoStep) * 1000;

      state.tickTimer = setTimeout(() => {
        nextSlide();
        state.tickTimer = setInterval(() => {
          nextSlide();
        }, stepMs);
      }, Math.max(0, msToNext));
    }

    // -----------------------------------------------------------------------------
    // Load slide definition from backend
    // - LIST_BOARD_IMAGES|<board_id> may return:
    //   - modern: object slide { step_sec, start_at, items:[...] } (items contain epochs)
    //   - compat: array of image ids (no time windows) -> treated as always active
    // -----------------------------------------------------------------------------
    async function loadBoardImagesList() {
      if (!state.boardId) return [];

      const res = await AFSendFlowMessage(state.appId, state.ownerId, "LIST_BOARD_IMAGES|" + state.boardId);

      // Normalize: backend may return object or stringified JSON
      let slide = null;

      if (res && typeof res === "object" && !Array.isArray(res)) {
        slide = res;
      } else if (typeof res === "string") {
        try {
          const parsed = JSON.parse(res);
          if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
            slide = parsed;
          }
        } catch {
          slide = null;
        }
      }

      // If we have a slide object, use it (preferred)
      if (slide) {

        // Use backend slide parameters (UNIX epoch seconds = UTC)
        state.slideSec = (typeof slide.step_sec === "number" && slide.step_sec > 0) ? slide.step_sec : state.slideSec;
        state.slideStartAt = (typeof slide.start_at === "number" && slide.start_at > 0) ? slide.start_at : state.slideStartAt;
        state.lastSlideLoadedAt = nowTs();

        // Keep full items for time-window filtering
        state.slideItems = extractSlideItems(slide);

      } else {

        // Backward-compat: if backend returns ids only, treat them as always-active
        let ids = [];

        if (Array.isArray(res)) {
          ids = uniqueStrings(res);
        } else if (typeof res === "string") {
          try {
            const parsed = JSON.parse(res);
            ids = Array.isArray(parsed) ? uniqueStrings(parsed) : [];
          } catch {
            ids = [];
          }
        }

        const now = nowTs();
        state.slideItems = ids.map(id => ({
          image_id: id,
          from_ts: 0,       // always active
          until_ts: 0,      // always active
          start_ts: now,    // not used in compat mode
        }));
      }

      // Cache eviction uses all known ids (not only currently active)
      const allIds = uniqueStrings(state.slideItems.map(it => String(it.image_id || "").trim()).filter(Boolean));
      purgeCache(allIds);

      // Preload all images into cache immediately (startup + refresh)
      await Promise.allSettled(allIds.map(id => ensureImageCached(id)));

      return allIds;
    }

    async function ensureImageCached(imageId) {
      if (!imageId) return makeMissingImageDataUrl("", "Missing image_id");

      const existing = state.cache[imageId];
      if (existing && existing.ready) {
        return existing.ready;
      }

      state.cache[imageId] = {
        src: "",
        ts: nowTs(),
        ready: (async () => {

          const b64 = await AFSendFlowMessage(
            state.appId,
            state.ownerId,
            "GET_BOARD_IMAGE|" + state.boardId + "|" + imageId
          );

          let src = "";
          if (typeof b64 === "string") {
            const raw = b64.trim();
            if (raw.length > 30 && raw !== "false") {
              src = "data:image/png;base64," + raw;
            }
          }

          if (!src) {
            src = makeMissingImageDataUrl(imageId, "FSDownload returned empty / not found");
          }

          // Decode offscreen so slideshow fade-in is identical cached vs not
          const img = new Image();
          img.src = src;

          if (img.decode) {
            try { await img.decode(); } catch { /* ignore */ }
          } else {
            await new Promise(resolve => { img.onload = img.onerror = resolve; });
          }

          state.cache[imageId].src = src;
          state.cache[imageId].ts = nowTs();
          return src;

        })()
      };

      return state.cache[imageId].ready;
    }

    async function fetchImageAsDataUrl(imageId) {
      if (!imageId) return null;

      if (state.cache[imageId] && state.cache[imageId].src) {
        return state.cache[imageId].src;
      }

      return await ensureImageCached(imageId);
    }

    function renderSlideMeta(imageId, idx, total, item) {
      const badge = `<span class="badge">${total ? (idx + 1) + " / " + total : "—"}</span>`;

      // Keep meta simple but useful: show id + until_ts for quick sanity checks
      const until = item && item.until_ts ? (" until " + item.until_ts) : "";
      ui.label.innerHTML =
        `${badge}<span style="opacity:.9">image_id:</span> ` +
        `<span style="font-family:ui-monospace,monospace;opacity:.8">${imageId || "(none)"}</span>` +
        `<span style="opacity:.55; margin-left:10px; font-family:ui-monospace,monospace;">${until}</span>`;
    }

    async function showSlide(index) {
      setClock();

      // Build ACTIVE playlist from epoch windows (computed at runtime)
      const active = getActiveItems(nowTs());
      const total = active.length;

      if (!total) {
        ui.imgA.classList.remove("is-visible");
        ui.imgB.classList.remove("is-visible");
        ui.imgA.src = makeMissingImageDataUrl("no-active", "No active images (time window)");
        requestAnimationFrame(() => ui.imgA.classList.add("is-visible"));
        renderSlideMeta("", 0, 0, null);
        setHint("No active images (waiting for next display window)");
        return;
      }

      const idx = ((index % total) + total) % total;
      state.currentIdx = idx;

      const item = active[idx];
      const imageId = String(item.image_id || "").trim();

      renderSlideMeta(imageId, idx, total, item);

      const nextLayer = state.activeLayer === "A" ? "B" : "A";
      const currentImg = state.activeLayer === "A" ? ui.imgA : ui.imgB;
      const nextImg = nextLayer === "A" ? ui.imgA : ui.imgB;

      const src = await fetchImageAsDataUrl(imageId);

      // Prepare next image underneath
      nextImg.src = src || makeMissingImageDataUrl(imageId, "Unknown error");
      nextImg.classList.remove("is-visible");
      void nextImg.offsetWidth;

      // Crossfade
      nextImg.classList.add("is-visible");
      currentImg.classList.remove("is-visible");

      state.activeLayer = nextLayer;

      if (src && src.startsWith("data:image/svg+xml")) {
        setHint("Missing image → showing placeholder");
      } else {
        setHint("Playing slideshow (active time windows)");
      }
    }

    async function nextSlide() {
      // Note: the active playlist may change over time (items expiring),
      // so showSlide() always re-builds it at the current moment.
      await showSlide(state.currentIdx + 1);
    }

    async function refreshListAndKeepRunning() {
      await loadBoardImagesList();

      // Sync index against backend schedule, but MODULO the ACTIVE playlist length
      // so everyone lands on the same "slot" among currently active items.
      const active = getActiveItems(nowTs());
      state.currentIdx = computeSyncedIndex(active.length);

      if (!state.isStarted) {
        state.isStarted = true;
        ui.root.style.display = "";
      }

      await showSlide(state.currentIdx);

      // Restart loop aligned to (start_at + N*step_sec)
      restartSlideLoopSynced();
    }

    // -----------------------------------------------------------------------------
    // UTC top-of-hour refresh
    // - First refresh happens immediately on startup
    // - Then refresh again exactly at the next UTC top-of-hour (HH:00:00Z)
    // - After that, refresh every hour
    //
    // Important: even without refresh, the board will still stop displaying an item
    // exactly at until_ts, because filtering is applied on every tick.
    // -----------------------------------------------------------------------------
    function msUntilNextUtcTopOfHour() {
      const nowMs = Date.now(); // epoch ms (UTC)
      const nowSec = Math.floor(nowMs / 1000);
      const nextHourSec = (Math.floor(nowSec / 3600) + 1) * 3600; // HH:00:00Z
      const deltaMs = (nextHourSec * 1000) - nowMs;
      return Math.max(0, deltaMs);
    }

    function startHourlyRefreshAlignedToUtc() {
      if (state.refreshAlignTimer) clearTimeout(state.refreshAlignTimer);
      if (state.refreshTimer) clearInterval(state.refreshTimer);
      state.refreshAlignTimer = null;
      state.refreshTimer = null;

      const firstDelay = msUntilNextUtcTopOfHour();

      state.refreshAlignTimer = setTimeout(async () => {
        await refreshListAndKeepRunning();
        state.refreshTimer = setInterval(refreshListAndKeepRunning, state.listRefreshMs);
      }, firstDelay);
    }

    // Main async flow
    WebControlReady.then(async function () {

      state.appId = await AFGetAppID();

      state.boardId = getQueryParam("board_id");
      state.ownerId = getQueryParam("owner_id");

      if (!state.boardId) {
        document.body.innerHTML =
          "<div style='padding:18px;font-family:system-ui;color:#fff;background:#111'>" +
          "Missing URL parameter: <b>board_id</b></div>";
        return;
      }

      // First load + start (synced)
      await refreshListAndKeepRunning();

      // Then refresh on UTC top-of-hour (aligned), then every hour
      startHourlyRefreshAlignedToUtc();

    });
  </script>
</body>
</html>
