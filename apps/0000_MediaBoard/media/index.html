<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MediaBoard</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: #0f0f10;
      color: #f0f0f0;
      overflow: hidden;
    }

    .board {
      width: 760px;
      max-width: calc(100vw - 40px);
      margin: 28px auto;
      background: #1b1b1f;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(0,0,0,0.45);
      padding: 18px;
      box-sizing: border-box;
      position: relative;
    }

    .frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0b0b0d;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .frame img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 320ms ease-in-out;
        background: #000;
    }

    .frame img.is-visible {
        opacity: 1;
    }

    .meta {
      margin-top: 12px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .meta .left {
      font-size: 13px;
      opacity: 0.85;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta .right {
      font-size: 12px;
      opacity: 0.65;
      white-space: nowrap;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 200, 51, 0.14);
      color: #ffc833;
      font-weight: 600;
      letter-spacing: 0.2px;
      margin-right: 8px;
    }

    .hint {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 12px;
      opacity: 0.7;
      background: rgba(0,0,0,0.35);
      padding: 6px 10px;
      border-radius: 999px;
      backdrop-filter: blur(6px);
    }
  </style>
</head>

<body>
  <div class="board" id="boardRoot" style="display:none;">
    <div class="hint" id="boardHint">Loading…</div>

    <div class="frame">
        <img id="slideImgA" alt="Slide A" />
        <img id="slideImgB" alt="Slide B" />
    </div>

    <div class="meta">
      <div class="left" id="slideLabel"></div>
      <div class="right" id="slideClock"></div>
    </div>
  </div>

  <!-- Include SLAppFlow public functions -->
  <script src="/webcontrol/include_functions.js"></script>

  <script>
    // -----------------------------------------------------------------------------
    // MediaBoard front-end (MEDIA)
    // - Loads LIST_BOARD_IMAGES on open, then refreshes every hour
    // - Fetches images via GET_BOARD_IMAGE
    // - Caches images by image_id (does not re-download if still needed)
    // - Purges cache entries that are no longer present in the latest list
    // - Simple slide loop using the board config (seconds_shown) when available
    // - If an image cannot be fetched, we render a placeholder "image" with the id
    // -----------------------------------------------------------------------------

    // Read query params (board_id and owner_id are required for MEDIA)
    const params = new URLSearchParams(window.location.search);

    const state = {
      boardId: (params.get("board_id") || "").trim(),       // expected to be a UUID string
      ownerId: (params.get("owner_id") || "").trim(),       // expected to be a UUID string
      appId: null,                                          // set on load
      slideSec: 10,                                         // default (overridden by slide.step_sec)
      listRefreshMs: 60 * 60 * 1000,                        // 1 hour
      currentIdx: 0,                                        // current index in the imageIds list for the slideshow
      imageIds: [],                                         // current list from backend (image_id only)
      cache: {},                                            // { [imageId]: { src: "data:image/...", ts: number, ready: Promise<string> } }
      tickTimer: null,
      refreshTimer: null,
      isStarted: false,
      activeLayer: "A",

      // Slide sync params (from backend slide node)
      slideStartAt: 0,                                      // UNIX seconds
      lastSlideLoadedAt: 0,                                 // UNIX seconds (debug / info)
    };

    // UI refs
    const ui = {
        root: document.getElementById("boardRoot"),
        hint: document.getElementById("boardHint"),
        imgA: document.getElementById("slideImgA"),
        imgB: document.getElementById("slideImgB"),
        label: document.getElementById("slideLabel"),
        clock: document.getElementById("slideClock"),
    };

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return (params.get(name) || "").trim();
    }

    function nowTs() {
      return Math.floor(Date.now() / 1000);
    }

    function setHint(text) {
      ui.hint.textContent = text;
    }

    function setClock() {
      // Local time is fine for the media UI
      ui.clock.textContent = new Date().toLocaleString("en-GB", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    function uniqueStrings(arr) {
      const out = [];
      for (const v of arr) {
        if (typeof v !== "string") continue;
        const s = v.trim();
        if (!s) continue;
        if (!out.includes(s)) out.push(s);
      }
      return out;
    }

    function purgeCache(keepIds) {
      const keep = new Set(keepIds);
      for (const k of Object.keys(state.cache)) {
        if (!keep.has(k)) delete state.cache[k];
      }
    }

    function makeMissingImageDataUrl(imageId, reason) {
      // SVG placeholder (acts like an image, so the slideshow continues smoothly)
      const safeId = String(imageId || "").replace(/[<>&"]/g, "");
      const safeReason = String(reason || "Missing image").replace(/[<>&"]/g, "");

      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#222"/>
              <stop offset="1" stop-color="#111"/>
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" fill="url(#g)"/>
          <text x="50%" y="44%" text-anchor="middle"
                font-family="system-ui, -apple-system, Segoe UI, Arial"
                font-size="40" fill="#ffc833" font-weight="700">
            Image not available
          </text>
          <text x="50%" y="54%" text-anchor="middle"
                font-family="system-ui, -apple-system, Segoe UI, Arial"
                font-size="22" fill="#eaeaea" opacity="0.9">
            ${safeReason}
          </text>
          <text x="50%" y="66%" text-anchor="middle"
                font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
                font-size="20" fill="#eaeaea" opacity="0.75">
            id: ${safeId}
          </text>
        </svg>`;

      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    }

    function extractImageIdsFromSlide(slide) {
      const items = (slide && Array.isArray(slide.items)) ? slide.items : [];
      const out = [];
      for (const it of items) {
        if (!it || typeof it !== "object") continue;
        const img = String(it.image_id || "").trim();
        if (!img) continue;
        out.push(img);
      }
      return uniqueStrings(out);
    }

    function computeSyncedIndex(total) {
      if (!total) return 0;

      const step = Math.max(1, state.slideSec);
      const startAt = (typeof state.slideStartAt === "number" && state.slideStartAt > 0)
        ? state.slideStartAt
        : nowTs();

      const elapsed = Math.max(0, nowTs() - startAt);
      const slot = Math.floor(elapsed / step);

      return slot % total;
    }

    function restartSlideLoopSynced() {
      if (state.tickTimer) clearInterval(state.tickTimer);

      const stepMs = Math.max(1, state.slideSec) * 1000;

      // Align ticks to the backend schedule (start_at + N*step_sec)
      const startAt = (typeof state.slideStartAt === "number" && state.slideStartAt > 0)
        ? state.slideStartAt
        : nowTs();

      const now = nowTs();
      const elapsed = Math.max(0, now - startAt);
      const intoStep = elapsed % Math.max(1, state.slideSec);
      const msToNext = (Math.max(1, state.slideSec) - intoStep) * 1000;

      state.tickTimer = setTimeout(() => {
        nextSlide();
        state.tickTimer = setInterval(() => {
          nextSlide();
        }, stepMs);
      }, Math.max(0, msToNext));
    }

    async function loadBoardImagesList() {
      // Must have boardId + appId
      if (!state.boardId) return [];

      let res = await AFSendFlowMessage(state.appId, state.ownerId, "LIST_BOARD_IMAGES|" + state.boardId);
      //console.log("LIST_BOARD_IMAGES response:", res);

      // Normalize: backend may return object or stringified JSON
      let slide = null;

      if (res && typeof res === "object" && !Array.isArray(res)) {
        slide = res;
      } else if (typeof res === "string") {
        try {
          const parsed = JSON.parse(res);
          if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
            slide = parsed;
          }
        } catch {
          slide = null;
        }
      }

      // Backward-compat: if backend still returns an array, accept it
      let list = [];
      if (!slide) {
        if (Array.isArray(res)) {
          list = uniqueStrings(res);
        } else if (typeof res === "string") {
          try {
            const parsed = JSON.parse(res);
            list = Array.isArray(parsed) ? uniqueStrings(parsed) : [];
          } catch {
            list = [];
          }
        } else {
          list = [];
        }
      } else {
        // Use backend slide parameters
        state.slideSec = (typeof slide.step_sec === "number" && slide.step_sec > 0) ? slide.step_sec : state.slideSec;
        state.slideStartAt = (typeof slide.start_at === "number" && slide.start_at > 0) ? slide.start_at : state.slideStartAt;
        state.lastSlideLoadedAt = nowTs();

        list = extractImageIdsFromSlide(slide);
      }

      // Cache eviction: remove entries not in the new list
      purgeCache(list);

      state.imageIds = list;

      // Compute synced index (everyone should land on same image for same slide.start_at/step_sec)
      state.currentIdx = computeSyncedIndex(state.imageIds.length);

      // Preload all images into cache immediately (startup + hourly refresh)
      await Promise.allSettled(list.map(id => ensureImageCached(id)));

      return list;
    }

    async function ensureImageCached(imageId) {
      if (!imageId) return makeMissingImageDataUrl("", "Missing image_id");

      // If already in cache and we already have a "ready" promise, await it
      const existing = state.cache[imageId];
      if (existing && existing.ready) {
        return existing.ready;
      }

      // Create a single shared "ready" promise per image_id
      state.cache[imageId] = {
        src: "",
        ts: nowTs(),
        ready: (async () => {

          // Download (base64)
          let b64 = await AFSendFlowMessage(
            state.appId,
            state.ownerId,
            "GET_BOARD_IMAGE|" + state.boardId + "|" + imageId
          );

          let src = "";
          if (typeof b64 === "string") {
            const raw = b64.trim();

            // Most failures in your backend return false => may arrive as "" or "false" depending on transport
            if (raw.length > 30 && raw !== "false") {
              src = "data:image/png;base64," + raw;
            }
          }

          // Failure -> placeholder
          if (!src) {
            src = makeMissingImageDataUrl(imageId, "FSDownload returned empty / not found");
          }

          // Decode offscreen so slideshow fade-in is identical cached vs not
          const img = new Image();
          img.src = src;

          if (img.decode) {
            try { await img.decode(); } catch { /* ignore */ }
          } else {
            await new Promise(resolve => { img.onload = img.onerror = resolve; });
          }

          state.cache[imageId].src = src;
          state.cache[imageId].ts = nowTs();
          return src;

        })()
      };

      return state.cache[imageId].ready;
    }

    async function fetchImageAsDataUrl(imageId) {
      if (!imageId) return null;

      // Cache hit
      if (state.cache[imageId] && state.cache[imageId].src) {
        return state.cache[imageId].src;
      }

      return await ensureImageCached(imageId);
    }

    function renderSlideMeta(imageId, idx, total) {
      const badge = `<span class="badge">${total ? (idx + 1) + " / " + total : "—"}</span>`;
      ui.label.innerHTML = `${badge}<span style="opacity:.9">image_id:</span> <span style="font-family:ui-monospace,monospace;opacity:.8">${imageId || "(none)"}</span>`;
    }

    async function showSlide(index) {
      setClock();

      const total = state.imageIds.length;
      if (!total) {
        ui.imgA.classList.remove("is-visible");
        ui.imgB.classList.remove("is-visible");
        ui.imgA.src = makeMissingImageDataUrl("no-images", "No images in board slide yet");
        requestAnimationFrame(() => ui.imgA.classList.add("is-visible"));
        renderSlideMeta("", 0, 0);
        setHint("No images (waiting for events / slide generation)");
        return;
      }

      const idx = ((index % total) + total) % total;
      state.currentIdx = idx;

      const imageId = state.imageIds[idx];
      renderSlideMeta(imageId, idx, total);

      const nextLayer = state.activeLayer === "A" ? "B" : "A";
      const currentImg = state.activeLayer === "A" ? ui.imgA : ui.imgB;
      const nextImg = nextLayer === "A" ? ui.imgA : ui.imgB;

      const src = await fetchImageAsDataUrl(imageId);

      // Prepare next image underneath
      nextImg.src = src || makeMissingImageDataUrl(imageId, "Unknown error");
      nextImg.classList.remove("is-visible");
      void nextImg.offsetWidth;

      // Crossfade
      nextImg.classList.add("is-visible");
      currentImg.classList.remove("is-visible");

      state.activeLayer = nextLayer;

      // Hint line
      if (src && src.startsWith("data:image/svg+xml")) {
        setHint("Missing image → showing placeholder");
      } else {
        setHint("Playing slideshow");
      }
    }

    async function nextSlide() {
      await showSlide(state.currentIdx + 1);
    }

    async function refreshListAndKeepRunning() {
      await loadBoardImagesList();

      // On every refresh, ensure we are synced to the backend schedule
      // (same image for everyone, even after reload)
      if (state.imageIds.length) {
        state.currentIdx = computeSyncedIndex(state.imageIds.length);
      } else {
        state.currentIdx = 0;
      }

      // If first start, show immediately
      if (!state.isStarted) {
        state.isStarted = true;
        ui.root.style.display = "";
      }

      await showSlide(state.currentIdx);

      // Restart loop aligned to (start_at + N*step_sec)
      restartSlideLoopSynced();
    }

    // Main async flow
    WebControlReady.then(async function () {

      state.appId = await AFGetAppID();

      // board_id is expected in query string for MEDIA
      // Example: media.html?board_id=<uuid>
      state.boardId = getQueryParam("board_id");

      if (!state.boardId) {
        document.body.innerHTML = "<div style='padding:18px;font-family:system-ui;color:#fff;background:#111'>Missing URL parameter: <b>board_id</b></div>";
        return;
      }

      // First load + start (synced)
      await refreshListAndKeepRunning();

      // Refresh list every hour
      state.refreshTimer = setInterval(refreshListAndKeepRunning, state.listRefreshMs);

    });
  </script>
</body>
</html>
