        <script>
            
            // Function to get the board ID from the URL query parameters
            async function getBoardID() 
            {

                // Gets the board ID from the URL query parameter board_id
                const params = new URLSearchParams(window.location.search);
                return params.get('board_id') || null;

            }

            // Function to populate the container with content
            async function populateContainer(content)
            {

                const container = document.querySelector('container');
                container.innerHTML = content;

            }
