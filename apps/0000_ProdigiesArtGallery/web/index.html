<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Paintings List</title>
    </head>
    <body>
        <div class="container">
            <!-- Left panel: Filters and paintings list -->
            <div class="left-panel">
                <!-- Dropdown for variants/lists (future extension) -->
                <div style="margin-bottom:8px;">
                    <select>
                        <option>Paintings List</option>
                    </select>
                </div>
                <!-- Filters + Columns button in one row -->
                <div class="filters">
                    <div>
                        <label><input type="checkbox" class="filter-checkbox" value="active" checked> Active</label>
                        <label><input type="checkbox" class="filter-checkbox" value="inactive" checked> Inactive</label>
                        <label><input type="checkbox" class="filter-checkbox" value="ended" checked> Ended</label>
                        <label><input type="checkbox" class="filter-checkbox" value="sold" checked> Sold</label>
                    </div>
                    <div class="settings-buttons">
                        <div class="settings" id="settings">
                            <button id="settings-btn">⚙️</button>
                            <div id="settings-menu"><!-- Injected by JS --></div>
                        </div>
                        <div class="column-options" id="column-options">
                            <button id="column-options-btn">☰</button>
                            <div id="column-options-menu"><!-- Injected by JS --></div>
                        </div>
                    </div>
                </div>
                <!-- Paintings table: main listing -->
                <table class="paintings-table">
                    <thead>
                        <!-- Content is injected via JS -->
                    </thead>
                    <tbody id="paintings-tbody">
                        <!-- Content is injected via JS -->
                    </tbody>
                </table>
            </div>
            <!-- Right panel: Preview and details (tabs) -->
            <div class="right-panel">
                <!-- Artwork preview -->
                <div class="preview" id="preview-image">
                    <!-- <span class="preview-upload-icon" title="Upload image">⬆️</span> -->
                    <span style="color:#bbb;">No preview</span>
                </div>
                <!-- Tabs for details -->
                <div class="tabs">
                    <div class="tab active" data-tab="general">General</div>
                    <div class="tab" data-tab="auction">Auction</div>
                    <div class="tab" data-tab="tracking">Tracking</div>
                </div>
                <!-- Tab content area -->
                <div class="tab-content" id="tab-content">
                    <!-- Content is injected via JS -->
                </div>
            </div>
        </div>
        <input type="file" id="image-upload-input" accept="image/png, image/jpeg" style="display:none;">
        <div id="auction-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:1000; align-items:center; justify-content:center;">
            <div style="background:#fff; padding:20px 24px; border-radius:10px; min-width:320px; box-shadow:0 0 12px rgba(0,0,0,0.3);">
                <h3 style="margin-top:0;">Start Auction</h3>
                <label>End Date<br>
                    <input type="text" id="auction-end-date" style="width:100%; margin-bottom:10px;" placeholder="YYYY-MM-DD HH:MM:SS">
                </label><br>
                <label>Start Price<br>
                    <input type="number" id="auction-start-price" style="width:100%; margin-bottom:16px;" value="10">
                </label><br>
                <div style="text-align:right;">
                    <button id="auction-cancel-btn" style="margin-right:8px;">Cancel</button>
                    <button id="auction-confirm-btn" style="background:#28a745; color:white;">Start</button>
                </div>
            </div>
        </div>

        <!-- Include SLAppFlow public functions -->
        <script src="/webcontrol/include_functions.js"></script>

        <script>

            // This will store the paintings
            let paintings = [];

            // Unicat image cache
            const imageCache = {}; // UNICAT number → Data URL

            // Keep track of the selected tab
            let currentTab = "general";

            // State & Rendering Logic
            let selectedPainting = null;
            let activeFilters = ["active", "inactive", "ended", "sold"];

            // Variables for sorting
            let sortKey = "number";      // default: UNICAT
            let sortDirection = "asc";   // "asc" or "desc"

            // The base columns (always visible)
            const baseColumns = [
                { key: "_row",   label: "", width: "40px" },   // Checkbox
                { key: "number", label: "UNICAT" },
                { key: "title",  label: "Title" },
                { key: "creator",label: "Creator" },
                { key: "status", label: "Status" }
            ];

            // Optional columns declaration
            window.optionalColumns = [
                { key: "bestBid", label: "Best bid", checked: true  },
                { key: "winnerName", label: "Winner", checked: false  },
                { key: "endDate", label: "Auction end date", checked: false },
                { key: "endTime", label: "Auction end time", checked: false }
            ];

            // Handle filter changes
            document.querySelectorAll('.filter-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', e => {
                    activeFilters = Array.from(document.querySelectorAll('.filter-checkbox'))
                        .filter(cb => cb.checked)
                        .map(cb => cb.value);
                    renderPaintingsTable();
                });
            });

            // Image upload
            document.addEventListener("DOMContentLoaded", function() {

                document.getElementById("image-upload-input").addEventListener("change", async function(event) {
                    const file = event.target.files[0];
                    if (!file || !selectedPainting) return;

                    const isImage = file.type === "image/png" || file.type === "image/jpeg";
                    if (!isImage) {
                        alert("Only PNG or JPEG images are allowed.");
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = async function(e) {
                        const base64 = e.target.result.split(",")[1];
                        const message = `SETIMAGE|${selectedPainting.number}|${base64}`;
                        const appId = await AFGetAppID();
                        await AFSendFlowMessage(appId, "Global", message);
                        imageCache[selectedPainting.number] = e.target.result;
                        selectPainting(selectedPainting);
                    };
                    reader.readAsDataURL(file);
                });

            });

            // Handle tab clicks
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    setActiveTab(this.getAttribute('data-tab'));
                });
            });

            // Main async flow
            WebControlReady.then(async function() 
            {

                // Load the CSS styles using WCGetInclude()
                document.head.insertAdjacentHTML("beforeend",`<style>${await WCGetInclude("style.css")}</style>`)

                // Loads the JavaScript functions using WCGetInclude()
                const jsCode = await WCGetInclude( "functions.js");
                const script = document.createElement("script");
                script.textContent = jsCode;
                document.head.appendChild(script);

                // Initialize optional columns
                await initializeOptionalColumns();

                // Send a message to the backend to retrieve the list of UNICAT paintings
                const result = await AFSendFlowMessage(await AFGetAppID(), "Global", "LISTUNICATS");
                //console.log(result); // For debugging: print the raw data to the console

                // Parse the result if it's a JSON string; otherwise, use as is
                let data = typeof result === 'string' ? JSON.parse(result) : result;

                // Map each backend entry to the format expected by the UI
                paintings = data.map((entry, idx) => ({
                    id: entry.number,                                                   // Use UNICAT number as unique row ID
                    unicat: true,                                                       // All are UNICAT (adjust if needed)
                    title: entry.name,                                                  // Painting title
                    creator: entry.creatorName,                                         // Name of the creator
                    status: (entry.status || "active").toLowerCase(),                   // Normalize status
                    preview: "",                                                        // No image for now
                    number: entry.number,                                               // UNICAT number, displayed in the table
                    category: entry.category || "",                                     // Category of the painting (E.g. Modernism)
                    description: entry.description,                                     // Painting description
                    winnerName: entry.winner_name || "",                                // Winner name (if available)
                    endDate: entry.end_date ? entry.end_date.substring(0, 10) : "",     // Session end date (if available)
                    endTime: entry.end_date ? entry.end_date.substring(11, 16) : "",    // Session end time (if available)

                    // Best bid amount (if available)
                    bestBid: (entry.best_bid !== null && entry.best_bid !== undefined && !isNaN(entry.best_bid) && Number(entry.best_bid) > 0) 
                    ? Number(entry.best_bid) + " L$" 
                    : ""

                }));

                // Render the table for the first time using the loaded paintings array
                renderPaintingsTable();
                
            });

        </script>
    </body>
</html>
