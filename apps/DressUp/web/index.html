<style>
    .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
    }
    .tab-button {
        padding: 10px;
        cursor: pointer;
        border: none;
        background: #ccc;
    }
    .tab-button:hover {
        background: #bbb;
    }
    .tab-content {
        display: none;
    }
    .tab-content.active {
        display: block;
    }
</style>

<!-- Loading public SLAppFlow commands -->
<script src="/webcontrol/include_functions.js"></script>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => {
            tab.style.display = 'none';
        });
        document.getElementById(tabId).style.display = 'block';
    }
    
    document.addEventListener("DOMContentLoaded", function() {
        switchTab('complete');
    });

    WebControlReady.then(async () => {
    try {

        // Loading outfits from the NVGetLists function
        const outfits = await NVGetLists("Outfit");
        const listContainer = document.getElementById("outfit-list");
        listContainer.innerHTML = ""; // Clears "Loading..."

        if (Array.isArray(outfits) && outfits.length > 0) {
            outfits.forEach(outfit => {
                const link = document.createElement("a");
                link.href = "#";
                link.textContent = outfit;
                link.style.display = "block";
                link.addEventListener("click", (e) => {
                    e.preventDefault();
                    console.log("You selected outfit:", outfit);
                    // TO IMPLEMENT: Add logic to apply the selected outfit
                });
                listContainer.appendChild(link);
            });
        } else {
            listContainer.innerHTML = "<p>No outfits available.</p>";
        }
    } catch (err) {
        console.error("[WebControl] Failed to load outfits:", err);
        document.getElementById("outfit-list").innerHTML = "<p>Error loading outfits.</p>";
    }

});

</script>

<div id="dressup-main">
    <select>
        <option value="myself">Myself ()</option>
    </select>
    
    <div class="tabs">
        <button class="tab-button" onclick="switchTab('complete')">Complete Outfits</button>
        <button class="tab-button" onclick="switchTab('individual')">Individual Clothing</button>
    </div>
    
    <div id="individual" class="tab-content">
        <p>Individual clothing items will be listed here.</p>
    </div>
    
    <div id="complete" class="tab-content active">
    <div class="outfit-list" id="outfit-list">
        <p>Loading outfits...</p>
    </div>
</div>
</div>
